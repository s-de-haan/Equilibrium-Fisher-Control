name: taskIL_other_CIFAR10
method: grid
project: paper-sweeps
metric:
  goal: maximize
  name: final_avg_accuracy

parameters:
  setting:
    value: TaskILCIFAR10

  # Training methods
  method:
    values:
      - bp
      - ewc
      - oewc
      - si

  layer_size:
    value: 100

  # Fixed parameters
  batch_size:
    value: 256
  num_workers:
    value: 0
  epochs:
    value: 20
  optimizer:
    value: Adam
  lr:
    value: 1e-4

  cnn_pretrained:
    value: True

  # Seeds for reproducibility
  seed:
    values:
      - 0
      - 1
      - 2
      - 3
      - 4

  # EWC/oEWC/SI parameters
  importance_ewc:
    value: 4.0

  # oEWC-specific
  gamma_oewc:
    value: 0.95
  normalize_fisher:
    value: True

  # SI-specific
  si_damping:
    value: 0.1

program: train.py
