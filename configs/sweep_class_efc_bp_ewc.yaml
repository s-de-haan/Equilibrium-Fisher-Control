method: grid
metric:
  goal: maximize
  name: final_avg_accuracy
parameters:
  num_workers:
    value: 0
  alpha_di:
    distribution: categorical
    values:
      - 0.0001
      - 0.001
  batch_size:
    value: 256
  beta_efc:
    distribution: categorical
    values:
      - 0.1
      - 0.8
      - 3
      - 20
  lr:
    distribution: categorical
    values:
      - 1e-06
      - 1e-05
      - 1e-04
  method:
    values: 
      - efc
      - bp
      - ewc
  optimizer:
    distribution: categorical
    values:
      - Adam
  seed:
    distribution: categorical
    values:
      - 69
      - 42
  tau:
    distribution: categorical
    values:
      - 1e-3
      - 1e-1
      - 5e-1
  eps:
    distribution: categorical
    values:
      - 1e-03
      - 1e-04
      - 2e-05
  target_lr:
    distribution: categorical
    values:
      - 1e-03
      - 5e-03
      - 1e-02
program: trainer_classIL.py
