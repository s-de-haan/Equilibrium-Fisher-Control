method: grid
metric:
  goal: maximize
  name: final_avg_accuracy
parameters:
  alpha_di:
    distribution: categorical
    values:
      - 0.0001
      - 0.001
  batch_size:
    value: 256
  beta_efc:
    distribution: categorical
    values:
      - 1
      - 2.5
      - 5
      - 7.5
      - 10
  eps:
    distribution: categorical
    values:
      - 1e-03
      - 1e-04
      - 2e-04
  lr:
    distribution: categorical
    values:
      - 1.5e-06
      - 3e-06
      - 5e-06
      - 1e-05
      - 5e-05
      - 1e-04
  method:
    value: efc
  optimizer:
    distribution: categorical
    values:
      - Adam
      - SGD
  seed:
    distribution: categorical
    values:
      - 1
      - 2
      - 3
      - 4
      - 5
  tau:
    distribution: categorical
    values:
      - 0.002
      - 0.008
      - 0.016
      - 0.032
  target_lr:
    distribution: categorical
    values:
      - 1e-04
      - 1e-03
      - 2e-03
program: train.py
